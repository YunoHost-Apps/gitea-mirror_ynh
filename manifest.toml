#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "gitea-mirror"
name = "Gitea Mirror"
description.en = "Auto-syncs GitHub repos to your self-hosted Gitea/Forgejo, with a sleek Web UI"
description.fr = "Synchronise automatiquement les dépôts GitHub vers votre instance Gitea/Forgejo auto-hébergée, le tout via une interface web élégante."

version = "3.45.0~ynh1"

maintainers = ["DeMiro5001"]

[upstream]
license = "AGPL-3.0"
website = "https://gitea-mirror.raylabs.io/"
code = "https://github.com/RayLabsHQ/gitea-mirror"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = true

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/gitea-mirror"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/RayLabsHQ/gitea-mirror/archive/refs/tags/v3.45.0.tar.gz"
    sha256 = "cb69102e9da5e68834f547e0af330848f8211b186a1b7f905705c8c9c67f1e63"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.nodejs]
    version = "24"
